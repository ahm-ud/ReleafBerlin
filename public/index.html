<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ReLeafBerlin – SPA</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  
  <script src="script.js" defer></script>
</head>

<body>

  <!-- =========================================================
       GLOBALER HEADER
       ========================================================= -->
  <header class="re-header" aria-label="Header">
    <div class="re-head-inner">
      <a class="re-brand" href="#" aria-label="ReLeafBerlin Home">
        <img class="re-logo" src="images/logo-releaf.png" alt="ReLeafBerlin logo" />
        <span class="sr-only">ReLeafBerlin</span>
      </a>
    </div>
    <div class="re-hero">
      <div class="re-hero-inner">
        <!-- Navigation entfernt -->
      </div>
    </div>
  </header>

  <!-- =========================================================
       MAIN CONTENT – SPA SCREENS
       ========================================================= -->
  <main class="re-content">

    <!-- ======================= LOGIN SCREEN ======================= -->
    <section id="screen-login" class="re-box">
      <div class="re-box-head"><h3>LOGIN</h3></div>
      <div class="re-box-body">
        <form class="re-form" id="loginForm">
          <label class="re-field">
            <span>Username <span class="req">*</span></span>
            <input type="text" required />
            <div class="re-hint">Bitte Username eingeben.</div>
          </label>

          <label class="re-field">
            <span>Password <span class="req">*</span></span>
            <input type="password" required />
            <div class="re-hint">Bitte Passwort eingeben.</div>
          </label>

          <div class="re-actions">
            <button 
              type="submit"
              class="btn btn-primary"
              onclick="this.form.classList.add('validated');">
              Login
            </button>
          </div>
        </form>
      </div>
    </section>

    <!-- ======================= MAIN SCREEN ======================== -->
    <section id="screen-main" class="re-box hidden">
      <div class="re-box-topbar">
        <button class="re-logout" type="button">Logout</button>
      </div>

      <div class="re-greeting">
        <h2 class="re-hero-hi in-box">
          Hi <strong class="rb-user">Username</strong>! Welcome to
          <strong class="rb-brand">ReLeafBerlin</strong>!
        </h2>
        <p class="re-hero-tagline in-box">– Together we make the world better –</p>
      </div>

      <div class="re-box-head">
        <h3>LOCATIONS</h3>
      </div>

      <div class="re-main-split">
        <div class="re-main-list">
          <div class="re-box-body" id="locationsList"></div>
        </div>

        <div class="re-main-map">
          <div id="map"></div>
        </div>
      </div>


      <div class="re-list-foot">
        <button class="re-add btn btn-primary" id="btnAdd">+ Add Location</button>
      </div>
    </section>

<!-- ======================= ADD SCREEN ========================= -->
  <section id="screen-add" class="re-box hidden">
    <div class="re-box-head"><h3>ADD LOCATION</h3></div>
    <div class="re-box-body">
      <form class="re-form" id="addForm">

        <!-- Title -->
        <label class="re-field">
          <span>Title <span class="req">*</span></span>
          <input type="text" id="addTitle" required />
          <div class="re-hint">Please enter a title.</div>
        </label>

        <!-- Description -->
        <label class="re-field">
          <span>Description</span>
          <textarea id="addDescription" rows="4" placeholder="Short description"></textarea>
        </label>

        <!-- Street -->
        <label class="re-field">
          <span>Street & No. <span class="req">*</span></span>
          <input type="text" id="addStreet" required />
          <div class="re-hint">Please enter a street.</div>
        </label>

        <!-- ZIP + City -->
        <label class="re-field">
          <span>ZIP + City <span class="req">*</span></span>
          <input type="text" id="addZipCity" required />
          <div class="re-hint">Please enter ZIP + City.</div>
        </label>

        <!-- Category -->
        <label class="re-field">
          <span>Category <span class="req">*</span></span>
          <select id="addCategory" required>
            <option value="">Choose…</option>
            <option value="Cycling Infrastructure">Cycling Infrastructure</option>
            <option value="Public Transport">Public Transport</option>
            <option value="Pedestrian Routes">Pedestrian Routes</option>
            <option value="Road Traffic (construction sites & traffic density)">Road Traffic (construction sites & traffic density)</option>
            <option value="Air">Air</option>
            <option value="Industrial Facilities">Industrial Facilities</option>
          </select>
          <div class="re-hint">Please choose a category.</div>
        </label>

        <!-- Upload Image -->
        <label class="re-field">
          <span>Upload Image</span>
          <input type="file" id="addImage" accept="image/*" />
        </label>

        <!-- Buttons -->
        <div class="re-actions">
          <button 
            type="submit"
            class="btn btn-primary"
            onclick="this.form.classList.add('validated');">
            Save
          </button>

          <button type="button" class="btn btn-ghost" id="cancelAdd">Cancel</button>
        </div>

      </form>
    </div>
  </section>


  <!-- ======================= DETAILS SCREEN ===================== -->
  <section id="screen-details" class="re-box hidden">
    <div class="re-box-head"><h3>LOCATION DETAILS</h3></div>

    <div class="re-box-body">
      <div class="re-details-grid">

        <figure class="re-details-media">
          <img id="detailImage" src="" alt="" />
          <figcaption id="detailImageCaption"></figcaption>
        </figure>

        <form class="re-form" id="detailsForm">

          <!-- Titel -->
          <label class="re-field">
            <span>Title <span class="req">*</span></span>
            <input type="text" id="detailTitle" required />
          </label>

          <!-- Beschreibung -->
          <label class="re-field">
            <span>Beschreibung des Standorts</span>
            <textarea id="detailDescription" rows="3"></textarea>
          </label>

          <!-- Straße -->
          <label class="re-field">
            <span>Street &amp; No. <span class="req">*</span></span>
            <input type="text" id="detailStreet" required />
          </label>

          <!-- PLZ + Stadt -->
          <label class="re-field">
            <span>ZIP + City <span class="req">*</span></span>
            <input type="text" id="detailZipCity" required />
          </label>

          <!-- Kategorie -->
          <label class="re-field">
            <span>Category <span class="req">*</span></span>
            <select id="detailCategory" required>
              <option value="">Choose…</option>
              <option value="Bicycle">Bike Path (paths, parking)</option>
              <option value="Public Transport">Public Transport</option>
              <option value="Pedestrians">Pedestrians</option>
              <option value="Road Traffic">Road Traffic (construction sites, traffic density)</option>
              <option value="Air">Air</option>
              <option value="Industrial Facilities">Industrial Facilities</option>
            </select>
          </label>

          <!-- Latitude (readonly) -->
          <label class="re-field">
            <span>Latitude</span>
            <input type="text" id="detailLat" readonly />
          </label>

          <!-- Longitude (readonly) -->
          <label class="re-field">
            <span>Longitude</span>
            <input type="text" id="detailLon" readonly />
          </label>

          <!-- Replace Image -->
          <label class="re-field">
            <span>
            Edit Image
            <small class="sub-text">(add or replace image)</small>
          </span>
            <input type="file" id="detailImageUpload" accept="image/*" />
            
          </label>  
          
          <!-- Delete Image -->
            <div id="imageFileInfo" class="mt-2">
            <div id="currentImageInfo"></div>
            <button type="button" id="removeSelectedImage" class="btn btn-sm btn-outline-danger">
              Delete Image
            </button>
          </div>
        </form>
      </div>

      <!-- Buttons -->
      <div class="re-actions" style="margin-top:16px; display:flex; gap:10px;">
        <button type="button" class="btn btn-primary" id="btnUpdate">Update</button>
        <button type="button" class="btn btn-danger" id="btnDelete">Delete</button>
        <button type="button" class="btn btn-ghost" id="closeDetails">Cancel</button>
      </div>

    </div>
  </section>
</main>

    <!-- =========================================================
                      GLOBALER FOOTER 
       ========================================================= -->
  <footer class="page-footer" role="contentinfo">
    <p><a href="#">Imprint</a> | <a href="#">Privacy Policy</a></p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>
</html>
